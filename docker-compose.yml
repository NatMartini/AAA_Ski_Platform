services:
  postgres:
    image: postgres:17-alpine
    container_name: ski-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ski
    ports:
      # Host port 5434 on purpose: 5432 is often a native install and 5433 is
      # taken by the Autofocus project's Postgres. Container port stays 5432.
      - "5434:5432"
    volumes:
      - ski-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ski"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ski-pgdata:
